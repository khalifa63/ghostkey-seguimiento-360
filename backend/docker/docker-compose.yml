version: '3.8'
services:
  postgresql:
    image: postgres:15
    container_name: ghostkey-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: seguimiento360
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  traccar:
    image: traccar/traccar:latest
    container_name: ghostkey-traccar
    ports:
      - "8082:8082"
      - "5055:5055"
    volumes:
      - traccar_data:/opt/traccar
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    container_name: ghostkey-nodered
    environment:
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET}
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ghostkey-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: ghostkey-influxdb
    environment:
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_INIT_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_INIT_ADMIN_TOKEN}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ghostkey-cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped

volumes:
  postgres_data:
  traccar_data:
  nodered_data:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
